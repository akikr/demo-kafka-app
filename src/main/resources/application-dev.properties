## Spring configuration
spring.docker.compose.enabled=false

## Actuator configuration
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=env
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.readiness.show-components=always
management.endpoint.health.group.readiness.show-details=always
management.endpoint.health.group.liveness.include=*
management.endpoint.health.group.liveness.show-components=always
management.endpoint.health.group.liveness.show-details=always

## OpenTelemetry Metrics config
management.metrics.enable.all=true
management.metrics.tags.application=${spring.application.name}
## OpenTelemetry Tracing config
management.tracing.enabled=true
# Management tracing sampling probability (1.0 = 100% traces sampled) for dev environment only
management.tracing.sampling.probability=1.0

# OTLP Metrics Exporter config
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
# OTLP Tracing Exporter config
management.otlp.tracing.export.enabled=true
management.otlp.tracing.transport=http
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
# OTLP Logging Exporter config
management.otlp.logging.export.enabled=true
management.otlp.logging.transport=http
management.otlp.logging.endpoint=http://localhost:4318/v1/logs
