## Kafka Observation Configuration
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

## Actuator config
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=env

# OpenTelemetry Metrics config
management.metrics.enable.all=true
management.metrics.tags.application=${spring.application.name}
# OTLP Metrics Exporter config
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:4317/v1/metrics

# OpenTelemetry Tracing config
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
# OTLP Tracing Exporter config
management.otlp.tracing.export.enabled=true
management.otlp.tracing.endpoint=http://localhost:4317/v1/traces

# OTLP Logging Exporter config
management.otlp.logging.export.enabled=true
management.otlp.logging.transport=http
management.otlp.logging.endpoint=http://localhost:4317/v1/logs

## Logging config
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [pdb-app] [%thread] [%X{traceId:-}:%X{spanId:-}] %-5level %logger{36} - %msg%n
