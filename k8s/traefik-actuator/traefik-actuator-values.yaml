deployment:
  enabled: true
  kind: DaemonSet

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-actuator

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-actuator

service:
  enabled: true
  type: ClusterIP

ports:
  web:
    port: 8000
    expose:
      default: false
  web8080:
    port: 8001
    expose:
      default: true
    exposedPort: 8080
    hostPort: 8080
