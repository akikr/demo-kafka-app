apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kafka.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kafka.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: init-cluster-id
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              CLUSTER_ID_FILE="{{ .Values.clusterId.filePath }}"
              CLUSTER_ID_DIR="$(dirname "$CLUSTER_ID_FILE")"
              mkdir -p "$CLUSTER_ID_DIR"
              if [ -s "$CLUSTER_ID_FILE" ]; then
                echo "Using existing CLUSTER_ID from $CLUSTER_ID_FILE"
              else
                /bin/kafka-storage random-uuid > "$CLUSTER_ID_FILE"
                echo "Generated new CLUSTER_ID in $CLUSTER_ID_FILE"
              fi
          volumeMounts:
            - name: kafka-cluster-id
              mountPath: {{ .Values.clusterId.filePath | dir | quote }}
      containers:
        - name: kafka
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export CLUSTER_ID="$(cat {{ .Values.clusterId.filePath | quote }})"
              exec /etc/confluent/docker/run
          ports:
            - name: plaintext
              containerPort: {{ .Values.containerPorts.plaintext }}
            - name: internal
              containerPort: {{ .Values.containerPorts.internal }}
            - name: controller
              containerPort: {{ .Values.containerPorts.controller }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: kafka-cluster-id
              mountPath: {{ .Values.clusterId.filePath | dir | quote }}
          readinessProbe:
            exec:
              command:
                - kafka-broker-api-versions
                - --bootstrap-server
                - localhost:{{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - kafka-broker-api-versions
                - --bootstrap-server
                - localhost:{{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: kafka-cluster-id
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "kafka.fullname" . }}-cluster-id{{ end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
