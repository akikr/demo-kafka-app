apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-lgtm.fullname" . }}
  labels:
    {{- include "otel-lgtm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "otel-lgtm.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    - name: otlp-grpc
      port: {{ .Values.service.otlpGrpcPort }}
      targetPort: {{ .Values.service.otlpGrpcPort }}
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.service.otlpHttpPort }}
      targetPort: {{ .Values.service.otlpHttpPort }}
      protocol: TCP
