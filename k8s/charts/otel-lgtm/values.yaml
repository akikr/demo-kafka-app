replicaCount: 1

nameOverride: ""
fullnameOverride: "otel-lgtm"

image:
  repository: grafana/otel-lgtm
  tag: "0.13.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  otlpGrpcPort: 4317
  otlpHttpPort: 4318

env:
  GF_PATHS_DATA: "/data/grafana"
  ENABLE_LOGS_ALL: "true"

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: otel-lgtm.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

readiness:
  path: "/"
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

liveness:
  path: "/"
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
