{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "demo-kafka-app.fullname" . }}
  labels:
    {{- include "demo-kafka-app.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.rewrite.enabled }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.rewrite.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-{{ include "demo-kafka-app.fullname" . }}-actuator-rewrite@kubernetescrd"
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ default "traefik" .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "demo-kafka-app.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
