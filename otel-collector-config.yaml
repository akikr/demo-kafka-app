receivers:
    otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

processors:
    batch:
    memory_limiter:
        check_interval: 1s
        limit_mib: 4000
        spike_limit_mib: 200

exporters:
    debug:
      verbosity: detailed
    otlphttp:
        endpoint: "http://lgtm:4318"
        tls:
          insecure: true

service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug, otlphttp]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug, otlphttp]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug, otlphttp]
